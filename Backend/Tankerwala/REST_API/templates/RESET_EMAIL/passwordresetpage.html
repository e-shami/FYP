{%load static%}
<!DOCTYPE html>
<html :class="{ 'theme-dark': day }" x-data="data()" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js"></script>
    <link rel="stylesheet" href="{%static '/assets/css/tailwind.output.css'%}" />
    <style>
      
      .loader {
        border: 3px solid #858585;
          border-radius: 50%;
          border-top: 3px solid white;
          width: 22px;
          height: 22px;
        -webkit-animation: spin 2s linear infinite; /* Safari */
        animation: spin 1s linear infinite;
      }
      
      /* Safari */
      @-webkit-keyframes spin {
        0% { -webkit-transform: rotate(0deg); }
        100% { -webkit-transform: rotate(360deg); }
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      </style>
    <script
      src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js"
      defer
    ></script>
    <script src="{%static '/assets/js/init-alpine.js'%}"></script>
  </head>
  <body>
    <div class="flex items-center min-h-screen p-6 bg-gray-50 dark:bg-gray-900">
        <div
          class="flex-1 h-full max-w-4xl mx-auto overflow-hidden bg-white rounded-lg shadow-xl dark:bg-gray-800"
        >
          <div class="flex flex-col overflow-y-auto md:flex-row">
            <div class="h-32 p-4 flex justify-center md:h-auto md:w-1/2">
              <img
                aria-hidden="true"
                  style="object-fit: contain"
                src="{%static 'assets/img/logoLight.png'%}"
                alt="City Go Logo"
              />

            </div>
            <div class="flex items-center justify-center p-6 sm:p-12 md:w-1/2">
              <div class="w-full">
                <h1
                  class="mb-4 text-xl font-semibold text-gray-700 dark:text-gray-200"
                >
  
                  City Go Reset Email
                  <li style="float:right">
                </li>
                </h1>
                
                <form  method="post">
                  {%csrf_token%}
                <label class="block text-sm">
                  <span class="text-gray-700 dark:text-gray-400">Email</span>
                  
                  <input
                         type="email" name="email"  required autocomplete="email" maxlength="254"
                    class="form block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                    placeholder="Email"
                  />
                </label>
                
                <p id="errors" style="color:red;font-size:15px">
                </p>
                <!-- You should use a button here, as the anchor is only used for the example  -->
                <input type="submit"
                  class="block w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-800 hover:bg-purple-700 focus:outline-none focus:shadow-outline-purple"
                    value="Reset my password"
                />
                </form>
                <hr class="my-8" />
              </div>
            </div>
          </div>
        </div>
        <script type="text/javascript" src="{%static 'assets/js/staffloginHandler.js'%}"></script>
      </div>
    </body>

</html>
